name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Собрать архив и .gma
        run: |
          mkdir -p build/lvs_scout_drr
          cp -r lua models materials addon.json build/lvs_scout_drr/
          cd build
          zip -r "../lvs_scout_drr-${GITHUB_REF_NAME}.zip" lvs_scout_drr
          cd ..
          python3 .github/scripts/make_gma.py build/lvs_scout_drr "lvs_scout_drr-${GITHUB_REF_NAME}.gma"
          ls -l lvs_scout_drr-${GITHUB_REF_NAME}.*

      - name: Приложить к релизу
        uses: softprops/action-gh-release@v2
        with:
          files: |
            lvs_scout_drr-${{ github.ref_name }}.zip
            lvs_scout_drr-${{ github.ref_name }}.gma
          overwrite_files: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
