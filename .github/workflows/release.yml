name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Собрать архив аддона
        run: |
          mkdir -p build/lvs_scout_drr
          cp -r lua models materials addon.json build/lvs_scout_drr/
          cd build
          zip -r "../lvs_scout_drr-${GITHUB_REF_NAME}.zip" lvs_scout_drr

      - name: Приложить к релизу
        uses: softprops/action-gh-release@v2
        with:
          files: lvs_scout_drr-${{ github.ref_name }}.zip
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true

      - name: Оповестить Discord
        if: success()
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TAG: ${{ github.ref_name }}
          URL: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          msg = ("@everyone\n"
                 f"Новый релиз LVS Scout {os.environ['TAG']}\n"
                 "Аддон для Drones Rewrite (GMod): щупальца, криолуч, щит, ЭМИ, стайный ИИ.\n"
                 f"Скачать: {os.environ['URL']}")

          body = json.dumps({"content": msg,
                             "allowed_mentions": {"parse": ["everyone"]}}).encode()

          req = urllib.request.Request(os.environ["HOOK"], data=body,
                                       headers={"Content-Type": "application/json"})
          urllib.request.urlopen(req).read()
          PY
